openapi: 3.0.3
info:
  title: Accreditation API (read)
  version: 0.2.0-draft
  description: |
    DRAFT v2 read-only API over Register & Enrol **accreditations**. It is an internal Defra API
    (first consumer: Re-Ex), not a public one. It replaces the v0.1 draft
    (removed from the repository; see git history) after architecture review. The changes are:

    * **Accreditation is the only top-level resource.** An accreditation exists only once its
      application has been approved. Organisation is internal (we do not own it). Registration
      and Application are not exposed: the organisation, registration and application endpoints,
      and the registration search, have been removed. Registration endpoints and registered
      overseas sites may come back once ORS management and its migration plan are worked out.
    * **Application-only data is not exposed.** That means application status, section statuses,
      uploaded files, sampling and inspection plans, `formSubmissionTime`, and
      the site flags `isNewSite` and `selected`.
    * **Status is a history with effective periods.** `statusHistory[]` records each status with
      the period it applies: `effectiveFromDate` (which may be in the future) and `effectiveToDate`
      (`null` on the latest entry). `latestStatus` is the latest entry of that history, whether or
      not its `effectiveFromDate` has arrived, so it always matches the history.
    * **Accredited overseas sites have their own status history** on the same rules, because an
      individual site can be suspended without suspending the whole accreditation.
    * **Tonnage band** is held on the accreditation, and its history is the accreditation's own
      history of band changes. Changes take effect when they are recorded (no forward-dating or
      backdating). The current band is returned on every
      accreditation, including in search results, because it is on the public register. The band
      history is returned only when getting one accreditation.
    * **Interim sites are returned inside their overseas site**, not from separate endpoints. They
      are part of the overseas site, not separate entities.
    * **PRN signatories** are returned when getting one accreditation, never in search results.
      They are personal data, and this is an internal API.
    * **The business plan is not available through this API.** The accreditation owns the plan
      entered in the frontend and reviewed by the regulator, but it is commercially sensitive.
    * **`accreditationReference` is now `accreditationNumber`**, and every path is versioned
      under `/v1`.

    **Identifiers are business references, never Mongo ObjectIds.** `organisationNumber` is the
    numeric ReEx org number (`OrgId`, e.g. 500500). `registrationNumber`, `accreditationNumber`
    and `orsId` are human-visible reference strings.

    Assumptions are marked `ASSUMPTION`:

    * ASSUMPTION: no authentication scheme is defined yet. It is expected to be HMAC request
      signing, to be specified later.
    * ASSUMPTION: `accreditationNumber` is unique across all organisations, so it identifies an
      accreditation on its own.
    * ASSUMPTION: a status takes effect at the start of its `effectiveFromDate` (UK time), and
      "today" is evaluated when the request is served.
    * ASSUMPTION: a tonnage band cannot be forward-dated or backdated; it takes effect when it
      is recorded.
servers:
  - url: /
tags:
  - name: Accreditations
  - name: Accredited overseas sites

paths:
  /v1/accreditations:
    get:
      tags: [Accreditations]
      operationId: searchAccreditations
      summary: Search accreditations across all organisations
      description: |
        Returns `AccreditationSummary` items, which carry the `latestStatus` and `tonnageBand`
        but no history, so the response stays small. Results are ordered by accreditation number,
        so the order is the same from one page to the next.

        Only accreditation years from 2027 are served. A search for an earlier year, such as
        `year=2026`, is a valid request and returns an empty page (`totalItems` 0), even where
        an accreditation was granted for that year. Getting one accreditation for an earlier
        year is a `404` (`accreditation_not_found`).
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/OrganisationNumberFilter'
        - $ref: '#/components/parameters/RegistrationNumberFilter'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of accreditation summaries. Filters combine with AND, and a filter that matches nothing is an empty page, not a 404.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AccreditationSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/organisations/{organisationNumber}/registrations/{registrationNumber}/accreditations/{year}:
    get:
      tags: [Accreditations]
      operationId: getAccreditation
      summary: Get the complete accreditation, with its histories and overseas sites
      parameters:
        - $ref: '#/components/parameters/OrganisationNumber'
        - $ref: '#/components/parameters/RegistrationNumber'
        - $ref: '#/components/parameters/AccreditationYear'
        - $ref: '#/components/parameters/IncludeWithdrawn'
      responses:
        '400': { $ref: '#/components/responses/BadRequest' }
        '200':
          description: The accreditation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accreditation' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/organisations/{organisationNumber}/registrations/{registrationNumber}/accreditations/{year}/overseas-sites:
    get:
      tags: [Accredited overseas sites]
      operationId: listAccreditedOverseasSites
      summary: List the overseas sites on an accreditation, with their interim sites
      description: |
        Returns only the overseas sites that were accredited. Sites the organisation registered
        but that were not included in this accreditation are not returned.
      parameters:
        - $ref: '#/components/parameters/OrganisationNumber'
        - $ref: '#/components/parameters/RegistrationNumber'
        - $ref: '#/components/parameters/AccreditationYear'
        - $ref: '#/components/parameters/IncludeWithdrawn'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of accredited overseas sites.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AccreditedOverseasSite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /v1/organisations/{organisationNumber}/registrations/{registrationNumber}/accreditations/{year}/overseas-sites/{orsId}:
    get:
      tags: [Accredited overseas sites]
      operationId: getAccreditedOverseasSite
      summary: Get an accredited overseas site, with its interim sites
      parameters:
        - $ref: '#/components/parameters/OrganisationNumber'
        - $ref: '#/components/parameters/RegistrationNumber'
        - $ref: '#/components/parameters/AccreditationYear'
        - $ref: '#/components/parameters/OrsId'
        - $ref: '#/components/parameters/IncludeWithdrawn'
      responses:
        '200':
          description: The accredited overseas site.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccreditedOverseasSite' }
        '404': { $ref: '#/components/responses/NotFound' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

components:
  parameters:
    OrganisationNumber:
      name: organisationNumber
      in: path
      required: true
      description: The numeric ReEx organisation number (`OrgId`), e.g. 500500.
      schema: { type: integer, format: int32 }
    RegistrationNumber:
      name: registrationNumber
      in: path
      required: true
      description: The registration number, e.g. `R27ER5000270036PL`.
      schema: { type: string }
    AccreditationYear:
      name: year
      in: path
      required: true
      description: The four digit accreditation year, e.g. 2027.
      schema: { type: integer, format: int32, minimum: 2000 }
    OrsId:
      name: orsId
      in: path
      required: true
      description: Overseas reconditioning/recycling site id (`OrsId`), e.g. `001`.
      schema: { type: string }
      example: '001'
    PageNumber:
      name: pageNumber
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Year:
      name: year
      in: query
      description: Accreditation year.
      schema: { type: integer, format: int32, minimum: 2000 }
    OrganisationNumberFilter:
      name: organisationNumber
      in: query
      description: Only accreditations of this organisation (the numeric ReEx organisation number), e.g. 500027.
      schema: { type: integer, format: int32, minimum: 1 }
    StatusFilter:
      name: status
      in: query
      description: |
        Only accreditations whose `latestStatus.status` is this. Only `approved` accreditations are served
        today, so `suspended`, `cancelled` and `withdrawn` are valid and return an empty page
        until case management can send them.
      schema: { type: string, enum: [approved, suspended, cancelled, withdrawn] }
    RegistrationNumberFilter:
      name: registrationNumber
      in: query
      description: Only accreditations of this registration, e.g. `R27ER5000270036PL`.
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,40}$' }
    IncludeWithdrawn:
      name: includeWithdrawn
      in: query
      description: Include withdrawn interim sites (`removedAt` set) in each overseas site's `interimSites`. They are retained for reporting.
      schema: { type: boolean, default: false }

  responses:
    BadRequest:
      description: Invalid query or path parameter.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource, or no such route (`code` `not_found`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: The request is not signed correctly (`code` says why, for example `missing_header` or `invalid_signature`).
      headers:
        WWW-Authenticate: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: The client is known but not allowed to make this request (`code` `forbidden`).
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    MethodNotAllowed:
      description: The API is read-only. Any method other than GET is refused (`code` `method_not_allowed`).
      headers:
        Allow: { schema: { type: string } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    TooManyRequests:
      description: The client made too many requests (`code` `rate_limited`). Wait for `Retry-After` seconds.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: The database stopped a query for taking too long (`code` `query_timeout`). Retry, with a narrower search if you can.
      headers:
        Retry-After: { schema: { type: integer } }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ---- shared ---------------------------------------------------------------------------
    PageMeta:
      type: object
      required: [pageNumber, limit, totalItems]
      properties:
        pageNumber: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string, description: A stable code for the kind of error, for example `invalid_year`. }
        traceId: { type: string, description: Quote this when asking for support. }
    MaterialType:
      type: string
      description: Mirrors the `MaterialType` enum.
      enum: [Steel, Wood, Aluminium, Fibre, Glass, Paper, Plastic]
    GlassRecyclingProcess:
      type: string
      description: Mirrors `GlassRecyclingProcess` (serialised member names).
      enum: [glass_re_melt, glass_other]
    Address:
      type: object
      properties:
        line1: { type: string, nullable: true }
        line2: { type: string, nullable: true }
        town: { type: string, nullable: true }
        county: { type: string, nullable: true }
        country: { type: string, nullable: true }
        postcode: { type: string, nullable: true }
        region: { type: string, nullable: true }
    ContactDetails:
      type: object
      properties:
        fullName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }

    # ---- accreditation --------------------------------------------------------------------
    AccreditationStatus:
      type: string
      description: |
        Statuses an accreditation, an overseas site on it, or an interim site can hold. It starts
        as `approved` when the application is approved. Allowed transitions (matching ReEx):
        `approved → suspended`, `suspended → approved`, `suspended → cancelled`. Cancellation is
        only reachable from `suspended`. Application statuses (submitted, queried, rejected, ...)
        are not exposed.
      enum: [approved, suspended, cancelled, withdrawn]
    TonnageBand:
      type: string
      description: Planned PRN/PERN issuance band. Values match ReEx `TONNAGE_BAND`.
      enum: [up_to_500, up_to_5000, up_to_10000, over_10000]
    Signatory:
      type: object
      description: A person authorised to sign PRNs/PERNs for the accreditation. Personal data.
      required: [fullName, email]
      properties:
        fullName: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
    StatusHistoryEntry:
      type: object
      description: Used by accreditations, accredited overseas sites and interim sites. Where two entries share an `effectiveFromDate`, the one with the later `recordedAt` takes precedence, and the earlier one is kept with its `effectiveToDate` equal to that same date.
      required: [status, effectiveFromDate, effectiveToDate, recordedAt]
      properties:
        status: { $ref: '#/components/schemas/AccreditationStatus' }
        effectiveFromDate:
          type: string
          format: date
          description: 'The first day the status applies: the later of 1 January of the accreditation year and the UK date the change was recorded. May be in the future.'
          example: '2027-01-01'
        effectiveToDate:
          type: string
          format: date
          nullable: true
          description: 'The last day the status applies: the day before the next entry''s `effectiveFromDate`. `null` on the latest entry.'
          example: null
        recordedAt:
          type: string
          format: date-time
          description: When the change was recorded.
    TonnageBandHistoryEntry:
      type: object
      description: A band takes effect when it is recorded; it cannot be forward-dated or backdated.
      required: [tonnageBand, recordedAt]
      properties:
        tonnageBand: { $ref: '#/components/schemas/TonnageBand' }
        recordedAt:
          type: string
          format: date-time
          description: When the band was recorded, which is also when it took effect.
    AccreditationSummary:
      type: object
      description: |
        The accreditation without its history; returned by search. `latestStatus` is the latest
        status history entry, the same entry in the same shape, so it always matches the history.
        It can be future-dated: a 2027 accreditation approved in November 2026 has a `latestStatus`
        of `approved` with an `effectiveFromDate` of 2027-01-01, which has not arrived yet. Use its
        effective dates to tell whether it is in effect. `tonnageBand` is the latest tonnage band
        history entry.
      required: [organisationNumber, registrationNumber, accreditationNumber, accreditationYear, material, wasteProcessingType, latestStatus]
      properties:
        organisationNumber: { type: integer, format: int32, description: ReEx numeric organisation number (`OrgId`). }
        registrationNumber: { type: string }
        accreditationNumber: { type: string }
        accreditationYear: { type: integer, format: int32 }
        material: { $ref: '#/components/schemas/MaterialType' }
        glassRecyclingProcess:
          type: string
          allOf: [{ $ref: '#/components/schemas/GlassRecyclingProcess' }]
          nullable: true
        wasteProcessingType: { type: string }
        latestStatus:
          allOf: [{ $ref: '#/components/schemas/StatusHistoryEntry' }]
          description: The latest entry in `statusHistory`: the latest `effectiveFromDate`, and the later `recordedAt` where two share one. It is the latest whether or not its `effectiveFromDate` has arrived.
        tonnageBand:
          type: string
          allOf: [{ $ref: '#/components/schemas/TonnageBand' }]
          nullable: true
    Accreditation:
      description: |
        An `AccreditationSummary` plus its full status and tonnage band history (oldest first),
        its PRN signatories and, for an exporter, every accredited overseas site with its interim
        sites and status history, so one request returns the complete accreditation. Returned only
        when getting one accreditation.
      allOf:
        - $ref: '#/components/schemas/AccreditationSummary'
        - type: object
          required: [statusHistory, tonnageBandHistory, signatories]
          properties:
            overseasSites:
              type: array
              description: |
                Exporters only, ordered by `orsId`, and unpaged. Omitted for a reprocessor, which
                has a site, not overseas sites. Withdrawn interim sites are left out unless
                `includeWithdrawn=true`.
              items: { $ref: '#/components/schemas/AccreditedOverseasSite' }
            signatories:
              type: array
              items: { $ref: '#/components/schemas/Signatory' }
            statusHistory:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/StatusHistoryEntry' }
            tonnageBandHistory:
              type: array
              items: { $ref: '#/components/schemas/TonnageBandHistoryEntry' }

    # ---- overseas sites -------------------------------------------------------------------
    InterimSite:
      type: object
      description: |
        `InterimSiteModel`, returned inside its overseas site. `removedAt` set means withdrawn;
        withdrawn sites are retained for reporting and only included with `includeWithdrawn=true`.
      required: [siteId, siteNumber, siteName, address, contact]
      properties:
        siteId: { type: integer, format: int32 }
        siteNumber: { type: string }
        siteName: { type: string }
        address:
          description: line1, town and country are mandatory.
          allOf:
            - $ref: '#/components/schemas/Address'
            - type: object
              required: [line1, town, country]
        contact:
          description: fullName, email and phone are mandatory.
          allOf:
            - $ref: '#/components/schemas/ContactDetails'
            - type: object
              required: [fullName, email, phone]
        operationCodes:
          type: array
          description: At least one of R12/R13 is required; R3/R4/R5 optional.
          items: { type: string }
        createdAt: { type: string, format: date-time, nullable: true }
        removedAt: { type: string, format: date-time, nullable: true }
    AccreditedOverseasSite:
      type: object
      description: |
        An overseas site included in an accreditation, with its interim sites. A site has its own
        status history because it can be suspended without suspending the whole accreditation.
        `latestStatus` is the latest entry of that history, on the same rule as
        `AccreditationSummary.latestStatus`.
      required: [siteId, siteName, latestStatus, statusHistory, interimSites]
      properties:
        siteId: { type: integer, format: int32 }
        orsId: { type: string, nullable: true, example: '001' }
        siteName: { type: string }
        formattedAddress: { type: string, nullable: true, description: Pre-formatted single-line address. }
        address:
          allOf: [{ $ref: '#/components/schemas/Address' }]
          type: object
          nullable: true
        coordinates: { type: string, nullable: true }
        contact:
          allOf: [{ $ref: '#/components/schemas/ContactDetails' }]
          type: object
          nullable: true
        operationCodes: { type: array, items: { type: string } }
        repatriatedLoads: { type: string, nullable: true }
        conditionsOfExport: { type: boolean, nullable: true }
        isEu: { type: boolean }
        isOecd: { type: boolean }
        latestStatus:
          allOf: [{ $ref: '#/components/schemas/StatusHistoryEntry' }]
          description: The latest entry in the site's `statusHistory`, the same entry in the same shape.
        statusHistory:
          type: array
          minItems: 1
          description: Oldest first.
          items: { $ref: '#/components/schemas/StatusHistoryEntry' }
        interimSites:
          type: array
          description: Active interim sites; withdrawn ones too when `includeWithdrawn=true`.
          items: { $ref: '#/components/schemas/InterimSite' }

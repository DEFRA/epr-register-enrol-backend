openapi: 3.0.3
info:
  title: Accreditation API (read)
  version: 0.2.0-draft
  description: |
    DRAFT v2 read-only API over Register & Enrol **accreditations**. It is an internal Defra API
    (first consumer: Re-Ex), not a public one. It replaces the v0.1 draft
    (`registration-accreditation-api.yaml`) after architecture review. The changes are:

    * **Accreditation is the only top-level resource.** An accreditation exists only once its
      application has been approved. Organisation is internal (we do not own it). Registration
      and Application are not exposed: the organisation, registration and application endpoints,
      and the registration search, have been removed. Registration endpoints and registered
      overseas sites may come back once ORS management and its migration plan are worked out.
    * **Application-only data is not exposed.** That means application status, section statuses,
      uploaded files, sampling and inspection plans, `formSubmissionTime`, and
      the site flags `isNewSite` and `selected`.
    * **Status is a history with effective dates.** `statusHistory[]` records each status with the
      date it takes effect, which may be in the future or backdated (e.g. a suspension).
      `status` is a projection: the latest entry whose `effectiveDate` is on or before today.
    * **Accredited overseas sites have their own status history** on the same rules, because an
      individual site can be suspended without suspending the whole accreditation.
    * **Tonnage band** is held as its own entity with its own history. Changes take effect when
      they are recorded (no forward-dating or backdating). The current band is returned on every
      accreditation, including in search results, because it is on the public register. The band
      history is returned only when getting one accreditation.
    * **Interim sites are returned inside their overseas site**, not from separate endpoints.
    * **PRN signatories** are returned when getting one accreditation, never in search results.
      They are personal data, and this is an internal API.
    * **The business plan is not available through this API.** The accreditation owns the plan
      entered in the frontend and reviewed by the regulator, but it is commercially sensitive.
    * **`accreditationReference` is now `accreditationNumber`**, and every path is versioned
      under `/v1`.

    **Identifiers are business references, never Mongo ObjectIds.** `organisationNumber` is the
    numeric ReEx org number (`OrgId`, e.g. 500500). `registrationNumber`, `accreditationNumber`
    and `orsId` are human-visible reference strings.

    Assumptions are marked `ASSUMPTION`:

    * ASSUMPTION: no authentication scheme is defined yet. It is expected to be HMAC request
      signing, to be specified later.
    * ASSUMPTION: `accreditationNumber` is unique across all organisations, so it identifies an
      accreditation on its own.
    * ASSUMPTION: a status takes effect at the start of its `effectiveDate` (UK time), and
      "today" is evaluated when the request is served.
    * ASSUMPTION: a tonnage band cannot be forward-dated or backdated; it takes effect when it
      is recorded.
servers:
  - url: /
tags:
  - name: Accreditations
  - name: Accredited overseas sites

paths:
  /v1/accreditations:
    get:
      tags: [Accreditations]
      operationId: searchAccreditations
      summary: Search accreditations across all organisations
      description: |
        Returns `AccreditationSummary` items, which carry the current `status` and `tonnageBand`
        but no history, so the response stays small.
      parameters:
        - $ref: '#/components/parameters/Year'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of accreditation summaries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AccreditationSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }

  /v1/organisations/{organisationNumber}/registrations/{registrationNumber}/accreditations/{year}:
    get:
      tags: [Accreditations]
      operationId: getAccreditation
      summary: Get an accreditation, with its status and tonnage band history
      parameters:
        - $ref: '#/components/parameters/OrganisationNumber'
        - $ref: '#/components/parameters/RegistrationNumber'
        - $ref: '#/components/parameters/AccreditationYear'
      responses:
        '200':
          description: The accreditation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Accreditation' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organisations/{organisationNumber}/registrations/{registrationNumber}/accreditations/{year}/overseas-sites:
    get:
      tags: [Accredited overseas sites]
      operationId: listAccreditedOverseasSites
      summary: List the overseas sites on an accreditation, with their interim sites
      description: |
        Returns only the overseas sites that were accredited. Sites the organisation registered
        but that were not included in this accreditation are not returned.
      parameters:
        - $ref: '#/components/parameters/OrganisationNumber'
        - $ref: '#/components/parameters/RegistrationNumber'
        - $ref: '#/components/parameters/AccreditationYear'
        - $ref: '#/components/parameters/IncludeWithdrawn'
        - $ref: '#/components/parameters/PageNumber'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of accredited overseas sites.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageMeta'
                  - type: object
                    required: [items]
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/AccreditedOverseasSite' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }

  /v1/organisations/{organisationNumber}/registrations/{registrationNumber}/accreditations/{year}/overseas-sites/{orsId}:
    get:
      tags: [Accredited overseas sites]
      operationId: getAccreditedOverseasSite
      summary: Get an accredited overseas site, with its interim sites
      parameters:
        - $ref: '#/components/parameters/OrganisationNumber'
        - $ref: '#/components/parameters/RegistrationNumber'
        - $ref: '#/components/parameters/AccreditationYear'
        - $ref: '#/components/parameters/OrsId'
        - $ref: '#/components/parameters/IncludeWithdrawn'
      responses:
        '200':
          description: The accredited overseas site.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccreditedOverseasSite' }
        '404': { $ref: '#/components/responses/NotFound' }

components:
  parameters:
    OrganisationNumber:
      name: organisationNumber
      in: path
      required: true
      description: The numeric ReEx organisation number (`OrgId`), e.g. 500500.
      schema: { type: integer, format: int32 }
    RegistrationNumber:
      name: registrationNumber
      in: path
      required: true
      description: The registration number, e.g. `R27ER5000270036PL`.
      schema: { type: string }
    AccreditationYear:
      name: year
      in: path
      required: true
      description: The four digit accreditation year, e.g. 2027.
      schema: { type: integer, format: int32, minimum: 2000 }
    OrsId:
      name: orsId
      in: path
      required: true
      description: Overseas reconditioning/recycling site id (`OrsId`), e.g. `001`.
      schema: { type: string }
      example: '001'
    PageNumber:
      name: pageNumber
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Year:
      name: year
      in: query
      description: Accreditation year.
      schema: { type: integer, format: int32, minimum: 2000 }
    IncludeWithdrawn:
      name: includeWithdrawn
      in: query
      description: Include withdrawn interim sites (`removedAt` set) in each overseas site's `interimSites`. They are retained for reporting.
      schema: { type: boolean, default: false }

  responses:
    BadRequest:
      description: Invalid query or path parameter.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: No such resource.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    # ---- shared ---------------------------------------------------------------------------
    PageMeta:
      type: object
      required: [pageNumber, limit, totalItems]
      properties:
        pageNumber: { type: integer, minimum: 1 }
        limit: { type: integer, minimum: 1 }
        totalItems: { type: integer, minimum: 0 }
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
    MaterialType:
      type: string
      description: Mirrors the `MaterialType` enum.
      enum: [Steel, Wood, Aluminium, Fibre, Glass, Paper, Plastic]
    GlassRecyclingProcess:
      type: string
      description: Mirrors `GlassRecyclingProcess` (serialised member names).
      enum: [glass_re_melt, glass_other]
    Address:
      type: object
      properties:
        line1: { type: string, nullable: true }
        line2: { type: string, nullable: true }
        town: { type: string, nullable: true }
        county: { type: string, nullable: true }
        country: { type: string, nullable: true }
        postcode: { type: string, nullable: true }
        region: { type: string, nullable: true }
    ContactDetails:
      type: object
      properties:
        fullName: { type: string, nullable: true }
        email: { type: string, nullable: true }
        phone: { type: string, nullable: true }

    # ---- accreditation --------------------------------------------------------------------
    AccreditationStatus:
      type: string
      description: |
        Statuses an accreditation, or an overseas site on it, can hold. It starts as `approved`
        when the application is approved. Allowed transitions (matching ReEx):
        `approved → suspended`, `suspended → approved`, `suspended → cancelled`. Cancellation is
        only reachable from `suspended`. Application statuses (submitted, queried, rejected, ...)
        are not exposed.
      enum: [approved, suspended, cancelled]
    TonnageBand:
      type: string
      description: Planned PRN/PERN issuance band. Values match ReEx `TONNAGE_BAND`.
      enum: [up_to_500, up_to_5000, up_to_10000, over_10000]
    Signatory:
      type: object
      description: A person authorised to sign PRNs/PERNs for the accreditation. Personal data.
      required: [fullName, email]
      properties:
        fullName: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
    StatusHistoryEntry:
      type: object
      description: Used by both accreditations and accredited overseas sites.
      required: [status, effectiveDate, recordedAt]
      properties:
        status: { $ref: '#/components/schemas/AccreditationStatus' }
        effectiveDate:
          type: string
          format: date
          description: When the status takes effect. May be in the future, or backdated (e.g. a suspension), so it is not necessarily the date it was recorded.
        recordedAt:
          type: string
          format: date-time
          description: When the change was recorded.
    TonnageBandHistoryEntry:
      type: object
      description: A band takes effect when it is recorded; it cannot be forward-dated or backdated.
      required: [tonnageBand, recordedAt]
      properties:
        tonnageBand: { $ref: '#/components/schemas/TonnageBand' }
        recordedAt:
          type: string
          format: date-time
          description: When the band was recorded, which is also when it took effect.
    AccreditationSummary:
      type: object
      description: |
        The accreditation without its history; returned by search. `status` is a projection for
        today: the latest status history entry whose `effectiveDate` is on or before today, so a
        forward-dated change does not show here until its date arrives. `tonnageBand` is the
        latest tonnage band history entry.
      required: [organisationNumber, registrationNumber, accreditationNumber, accreditationYear, material, wasteProcessingType, status]
      properties:
        organisationNumber: { type: integer, format: int32, description: ReEx numeric organisation number (`OrgId`). }
        registrationNumber: { type: string }
        accreditationNumber: { type: string }
        accreditationYear: { type: integer, format: int32 }
        material: { $ref: '#/components/schemas/MaterialType' }
        glassRecyclingProcess:
          type: string
          allOf: [{ $ref: '#/components/schemas/GlassRecyclingProcess' }]
          nullable: true
        wasteProcessingType: { type: string }
        status: { $ref: '#/components/schemas/AccreditationStatus' }
        tonnageBand:
          type: string
          allOf: [{ $ref: '#/components/schemas/TonnageBand' }]
          nullable: true
    Accreditation:
      description: |
        An `AccreditationSummary` plus its full status and tonnage band history (oldest first)
        and its PRN signatories. Returned only when getting one accreditation.
      allOf:
        - $ref: '#/components/schemas/AccreditationSummary'
        - type: object
          required: [statusHistory, tonnageBandHistory, signatories]
          properties:
            signatories:
              type: array
              items: { $ref: '#/components/schemas/Signatory' }
            statusHistory:
              type: array
              minItems: 1
              items: { $ref: '#/components/schemas/StatusHistoryEntry' }
            tonnageBandHistory:
              type: array
              items: { $ref: '#/components/schemas/TonnageBandHistoryEntry' }

    # ---- overseas sites -------------------------------------------------------------------
    InterimSite:
      type: object
      description: |
        `InterimSiteModel`, returned inside its overseas site. `removedAt` set means withdrawn;
        withdrawn sites are retained for reporting and only included with `includeWithdrawn=true`.
      required: [siteId, siteNumber, siteName, address, contact]
      properties:
        siteId: { type: integer, format: int32 }
        siteNumber: { type: string }
        siteName: { type: string }
        address:
          description: line1, town and country are mandatory.
          allOf:
            - $ref: '#/components/schemas/Address'
            - type: object
              required: [line1, town, country]
        contact:
          description: fullName, email and phone are mandatory.
          allOf:
            - $ref: '#/components/schemas/ContactDetails'
            - type: object
              required: [fullName, email, phone]
        operationCodes:
          type: array
          description: At least one of R12/R13 is required; R3/R4/R5 optional.
          items: { type: string }
        createdAt: { type: string, format: date-time, nullable: true }
        removedAt: { type: string, format: date-time, nullable: true }
    AccreditedOverseasSite:
      type: object
      description: |
        An overseas site included in an accreditation, with its interim sites. A site has its own
        status history because it can be suspended without suspending the whole accreditation.
        `status` is projected for today on the same rule as `AccreditationSummary.status`.
      required: [siteId, siteName, status, statusHistory, interimSites]
      properties:
        siteId: { type: integer, format: int32 }
        orsId: { type: string, nullable: true, example: '001' }
        siteName: { type: string }
        formattedAddress: { type: string, nullable: true, description: Pre-formatted single-line address. }
        address:
          allOf: [{ $ref: '#/components/schemas/Address' }]
          type: object
          nullable: true
        coordinates: { type: string, nullable: true }
        contact:
          allOf: [{ $ref: '#/components/schemas/ContactDetails' }]
          type: object
          nullable: true
        operationCodes: { type: array, items: { type: string } }
        repatriatedLoads: { type: string, nullable: true }
        conditionsOfExport: { type: boolean, nullable: true }
        isEu: { type: boolean }
        isOecd: { type: boolean }
        validFrom:
          type: string
          format: date-time
          nullable: true
          description: Date the site was approved onto the accreditation (ReEx ORS-A approval date).
        status: { $ref: '#/components/schemas/AccreditationStatus' }
        statusHistory:
          type: array
          minItems: 1
          description: Oldest first.
          items: { $ref: '#/components/schemas/StatusHistoryEntry' }
        interimSites:
          type: array
          description: Active interim sites; withdrawn ones too when `includeWithdrawn=true`.
          items: { $ref: '#/components/schemas/InterimSite' }
